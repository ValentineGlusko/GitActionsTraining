    workflow_run:
        workflows: [second Workflow]
        types:
            - completed
jobs:
    success-command:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success'  }}
        steps:
            - name: List files
              run: |
                  echo $(ls -lia)
                  echo 'this is success '
    not_success_run:
        runs-on: ubuntu-lates
