## 
name: input demo
on:
    workflow_dispatch:
        inputs:
          environment:
           description: Get me environment variable
           required: true
           default: dev
           type: choice
           options:
            - dev
            - test
            - prod    
          tag:
            description: choose tag
            required: true
jobs:
    inputs-demo:
        runs-on: ubuntu-latest
        steps:
            - name: deploy app
              id: step1
              run: | 
                echo 'test deploying ${{ inputs.tag  }} application to the ${{ inputs.environment }}' 
                echo  'Name event ${{ github.event_name }}' 
                echo   ' ${{  github.repository  }} '
                echo '${{ github.ref }}'
                echo  test="${{ github.actor }}" >> $GITHUB_OUTPUT
                echo '${{ github.sha }}'
                echo '${{ github.workflow }}'
            - name: next step
              run:  | 
                    echo ' HRE IS : ${{ steps.step1.outputs.test }}'
    
 
